version: '3.8'

services:
  node-1:
    image: local/bot-node-base:latest
    container_name: node-1
    restart: unless-stopped
    volumes:
      - ./node-1/config.json:/app/dist/config.json:ro
      - ./node-1/sessions:/app/sessions
    environment:
      TZ: "Asia/Shanghai"
      NODE_ENV: "production"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true

  node-2:
